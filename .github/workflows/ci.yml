name: Bash Script CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck app_calculator.sh
      - name: Проверка суммы
        run: |
          output=$(./app_calculator.sh 5 10)
          echo "$output"
          [[ "$output" == "Сумма: 15" ]]
